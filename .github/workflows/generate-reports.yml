name: Generate Country Reports

on:

  workflow_dispatch:

  workflow_run:
    workflows:
      - Update Balkan Political Monitor
    types:
      - completed

permissions:
  contents: write

jobs:

  generate-reports:

    runs-on: ubuntu-latest

    steps:

      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Országriportok generálása
        run: python scripts/generate_country_reports.py

      - name: Változások commitolása
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/reports/
          git add docs/data/reports_index.json

          git commit -m "Automatikus országriport generálás" || echo "Nincs változás"

          git push
