name: Update Balkan Political Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python csomagok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install feedparser
          pip install requests

      - name: Hírmonitor script futtatása
        run: python scripts/fetch_news.py

      - name: Social monitor script futtatása
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/fetch_social.py

      - name: Social history frissítése
        run: python scripts/update_social_history.py

      - name: Országjelentések és AI elemzések generálása
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/generate_country_reports.py

      - name: Változások commitolása
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/latest.json
          git add docs/data/history.json
          git add docs/data/social_latest.json
          git add docs/data/social_history.json
          git add docs/data/reports_index.json
          git add docs/reports/

          git commit -m "Automatikus adatfrissítés, social risk és AI országjelentések" || echo "Nincs változás"

          git push
