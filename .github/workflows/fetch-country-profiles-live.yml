name: Fetch Country Profiles Live Data

on:
  workflow_dispatch:

  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: write

jobs:
  fetch-country-profiles-live:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Live makroadatok lekérése
        run: python scripts/fetch_macro_data.py

      - name: Változások commitolása
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add \
            docs/data/country_profiles_live.json \
            docs/data/fx_history.json \
            docs/data/interest_rate_history.json

          git commit -m "Országprofil live makroadatok frissítése" || echo "Nincs változás"

          git push
