<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Balkán Országprofil Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      background: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 26px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin-top: 8px;
      color: #d1d5db;
    }

    main {
      max-width: 1450px;
      margin: 22px auto;
      padding: 0 16px;
    }

    .top-box {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .button {
      display: inline-block;
      padding: 11px 15px;
      border-radius: 12px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .button:hover {
      background: #374151;
    }

    .small {
      color: #6b7280;
      font-size: 13px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(410px, 1fr));
      gap: 18px;
    }

    .country-card {
      background: white;
      border-radius: 14px;
      border-left: 7px solid #2563eb;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .card-inner {
      padding: 16px;
    }

    .country-title {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
      line-height: 1.45;
    }

    .section-box {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
      background: #ffffff;
    }

    .section-box h3 {
      margin: 0 0 9px 0;
      font-size: 15px;
    }

    .live-box {
      background: #eff6ff;
      border-color: #93c5fd;
    }

    .source-box {
      background: #f9fafb;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .metric {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
    }

    .metric strong {
      display: block;
      font-size: 16px;
      margin-top: 3px;
    }

    .leader-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .leader-box {
      background: #f9fafb;
      border-radius: 10px;
      padding: 9px;
      font-size: 13px;
    }

    .leader-box strong {
      display: block;
      margin-top: 4px;
      font-size: 14px;
    }

    .chart-wrap {
      height: 210px;
    }

    .mini-chart-wrap {
      height: 160px;
    }

    .source-list {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
      color: #374151;
      line-height: 1.45;
    }

    .source-list li {
      margin-bottom: 7px;
    }

    footer {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      padding: 28px 10px;
    }

    @media (max-width: 600px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .leader-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Balkán Országprofil Dashboard</h1>
  <p>Politikai vezetés, társadalmi szerkezet, parlamenti arányok, live árfolyamok és gazdasági mutatók</p>
</header>

<main>

  <section class="top-box">
    <strong>Országprofil nézet</strong>
    <p class="small" id="updatedAt">Betöltés...</p>
    <p class="small" id="liveUpdatedAt"></p>
    <p class="small" id="qualityNote"></p>

    <div class="button-row">
      <a class="button" href="./index.html">Vissza a politikai hangulatmonitorhoz</a>
      <a class="button" href="./security-map.html">Security Risk Map</a>
    </div>
  </section>

  <section class="dashboard-grid" id="profileGrid"></section>

</main>

<footer>
  Balkán Országprofil Dashboard – GitHub Pages
</footer>

<script>
let chartStore = {};

async function loadProfiles() {
  try {
    const baseResponse = await fetch('./data/country_profiles.json');
    const liveResponse = await fetch('./data/country_profiles_live.json');

    const data = await baseResponse.json();
    let liveData = null;

    try {
      liveData = await liveResponse.json();
    } catch (liveError) {
      console.warn('country_profiles_live.json nem tölthető be', liveError);
    }

    document.getElementById('updatedAt').textContent =
      `Utolsó strukturális frissítés: ${data.updated_at || 'nincs adat'}`;

    document.getElementById('qualityNote').textContent =
      data.data_quality_note || 'A strukturális adatok alapadatként kezelendők, rendszeres forrásellenőrzéssel.';

    document.getElementById('liveUpdatedAt').textContent =
      liveData
        ? `Live makroadatok frissítése: ${liveData.updated_at || 'nincs adat'} | FX forrás: ${liveData.fx_source?.name || 'nincs adat'} (${liveData.fx_source?.date || 'nincs dátum'})`
        : 'Live makroadatok: nem érhetők el.';

    const grid = document.getElementById('profileGrid');
    grid.innerHTML = '';

    data.countries.forEach(country => {
      const slug = slugify(country.name);

      const parliamentChartId = `parliament-${slug}`;
      const ethnicityChartId = `ethnicity-${slug}`;
      const religionChartId = `religion-${slug}`;
      const tradeChartId = `trade-${slug}`;
      const economyChartId = `economy-${slug}`;

      const economy = country.economy || {};
      const baseBank = country.central_bank || {};
      const leadership = country.leadership || {};
      const live = getLiveCountry(country.name, liveData);
      const liveBank = live?.central_bank || {};
      const fx = live?.fx || {};

      const displayedRate = liveBank.policy_rate ?? baseBank.interest_rate ?? null;

      const card = document.createElement('div');
      card.className = 'country-card';

      card.innerHTML = `
        <div class="card-inner">

          <div class="country-title">${escapeHtml(country.name)}</div>

          <div class="subtitle">
            Főváros: ${escapeHtml(country.capital || 'nincs adat')} |
            Államforma: ${escapeHtml(country.government_type || 'nincs adat')} |
            Valuta: ${escapeHtml(country.currency || 'nincs adat')}
          </div>

          <div class="section-box live-box">
            <h3>Live makroadatok</h3>

            <div class="metric-grid">
              <div class="metric">
                EUR árfolyam
                <strong>${formatFxRate(fx.rate, fx.quote || country.currency)}</strong>
              </div>

              <div class="metric">
                FX dátum
                <strong>${fx.date || 'n/a'}</strong>
              </div>

              <div class="metric">
                Jegybanki kamat
                <strong>${formatPercent(displayedRate)}</strong>
              </div>
            </div>

            <p class="small" style="margin-bottom:0;">
              FX megjegyzés: ${escapeHtml(fx.note || 'nincs megjegyzés')}<br>
              Jegybank: ${escapeHtml(liveBank.name || baseBank.source || 'nincs adat')}<br>
              Monetáris megjegyzés: ${escapeHtml(liveBank.note || baseBank.note || 'nincs külön megjegyzés')}
            </p>
          </div>

          <div class="section-box">
            <h3>Politikai vezetés</h3>

            <div class="leader-grid">
              <div class="leader-box">
                Államfő
                <strong>${escapeHtml(leadership.president || 'nincs adat')}</strong>
              </div>

              <div class="leader-box">
                Kormányfő
                <strong>${escapeHtml(leadership.prime_minister || 'nincs adat')}</strong>
              </div>
            </div>
          </div>

          <div class="section-box">
            <h3>Társadalmi alapadatok</h3>

            <div class="metric-grid">
              <div class="metric">Lakosság<strong>${formatNumber(country.population)}</strong></div>
              <div class="metric">Medián életkor<strong>${country.median_age || 'n/a'}</strong></div>
              <div class="metric">Valuta<strong>${escapeHtml(country.currency || 'n/a')}</strong></div>
            </div>
          </div>

          <div class="section-box">
            <h3>Parlamenti arányok</h3>
            <div class="chart-wrap">
              <canvas id="${parliamentChartId}"></canvas>
            </div>
          </div>

          <div class="section-box">
            <h3>Etnikai / kisebbségi megoszlás</h3>
            <div class="chart-wrap">
              <canvas id="${ethnicityChartId}"></canvas>
            </div>
            ${buildNoDataNote(country.ethnicity, 'Etnikai/kisebbségi adat még nincs rögzítve a country_profiles.json fájlban.')}
          </div>

          <div class="section-box">
            <h3>Vallási megoszlás</h3>
            <div class="chart-wrap">
              <canvas id="${religionChartId}"></canvas>
            </div>
          </div>

          <div class="section-box">
            <h3>Gazdasági mutatók</h3>

            <div class="metric-grid">
              <div class="metric">GDP<strong>${economy.gdp_billion_usd || 0} mrd USD</strong></div>
              <div class="metric">GDP/fő<strong>${formatNumber(economy.gdp_per_capita_usd)} USD</strong></div>
              <div class="metric">Nettó bér<strong>${economy.average_net_salary_eur || 0} EUR</strong></div>
              <div class="metric">Infláció<strong>${economy.inflation_percent || 0}%</strong></div>
              <div class="metric">Munkanélküliség<strong>${economy.unemployment_percent || 0}%</strong></div>
              <div class="metric">Jegybanki kamat<strong>${formatPercent(displayedRate)}</strong></div>
            </div>
          </div>

          <div class="section-box">
            <h3>Export, import, kereskedelmi mérleg</h3>
            <div class="mini-chart-wrap">
              <canvas id="${tradeChartId}"></canvas>
            </div>
          </div>

          <div class="section-box">
            <h3>Gazdasági összevető mini chart</h3>
            <div class="mini-chart-wrap">
              <canvas id="${economyChartId}"></canvas>
            </div>
          </div>

          <div class="section-box source-box">
            <h3>Források és adatminőség</h3>
            ${buildSourcesHtml(country, data.global_sources || [], live)}
          </div>

        </div>
      `;

      grid.appendChild(card);

      createPieChart(
        parliamentChartId,
        country.parliament?.parties || [],
        'seats',
        'name',
        'Mandátum'
      );

      createPieChart(
        ethnicityChartId,
        country.ethnicity || [],
        'percent',
        'group',
        'Arány'
      );

      createPieChart(
        religionChartId,
        country.religion || [],
        'percent',
        'group',
        'Arány'
      );

      createTradeChart(tradeChartId, economy);
      createEconomyChart(economyChartId, economy, { interest_rate: displayedRate });
    });

  } catch (error) {
    console.error(error);

    document.getElementById('profileGrid').innerHTML = `
      <div class="country-card">
        <div class="card-inner">
          <div class="country-title">Adatbetöltési hiba</div>
          <p>Nem sikerült betölteni a country_profiles.json vagy country_profiles_live.json fájlt.</p>
        </div>
      </div>
    `;
  }
}

function getLiveCountry(countryName, liveData) {
  if (!liveData || !liveData.countries) return null;

  return liveData.countries.find(item => item.name === countryName) || null;
}

function buildNoDataNote(rows, text) {
  if (rows && rows.length) return '';

  return `<p class="small">${escapeHtml(text)}</p>`;
}

function buildSourcesHtml(country, globalSources, live) {
  const countrySources = country.sources || [];
  let html = '';

  if (country.data_quality) {
    html += `<p class="small"><strong>Adatminőség:</strong> ${escapeHtml(country.data_quality)}</p>`;
  }

  if (countrySources.length) {
    html += '<ul class="source-list">';

    countrySources.forEach(source => {
      const fields = source.fields ? source.fields.join(', ') : 'általános országprofil-adat';

      html += `
        <li>
          <strong>${escapeHtml(source.name)}</strong> – ${escapeHtml(fields)}
        </li>
      `;
    });

    html += '</ul>';
  } else if (globalSources.length) {
    html += '<ul class="source-list">';

    globalSources.forEach(source => {
      html += `
        <li>
          <strong>${escapeHtml(source.name)}</strong> – ${escapeHtml(source.use || '')}
        </li>
      `;
    });

    html += '</ul>';
  } else {
    html += '<p class="small">Forrásblokk még nincs kitöltve a country_profiles.json fájlban.</p>';
  }

  if (live) {
    html += `
      <p class="small" style="margin-top:10px;">
        Live FX/kamat kiegészítő:
        ${escapeHtml(live.fx?.source || 'ECB / jegybanki forrás')}.
        Árfolyam dátuma:
        ${escapeHtml(live.fx?.date || 'nincs adat')}.
      </p>
    `;
  }

  return html;
}

function createPieChart(canvasId, rows, valueKey, labelKey, label) {
  const canvas = document.getElementById(canvasId);

  if (!canvas) return;

  if (chartStore[canvasId]) {
    chartStore[canvasId].destroy();
  }

  const safeRows = rows && rows.length
    ? rows
    : [{ [labelKey]: 'Nincs adat', [valueKey]: 1 }];

  chartStore[canvasId] = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: safeRows.map(item => item[labelKey]),
      datasets: [{
        label: label,
        data: safeRows.map(item => item[valueKey]),
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            boxWidth: 11,
            font: { size: 10 }
          }
        },
        tooltip: {
          backgroundColor: '#111827',
          padding: 9
        }
      }
    }
  });
}

function createTradeChart(canvasId, economy) {
  const canvas = document.getElementById(canvasId);

  if (!canvas) return;

  if (chartStore[canvasId]) {
    chartStore[canvasId].destroy();
  }

  chartStore[canvasId] = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: ['Export', 'Import', 'Mérleg'],
      datasets: [{
        label: 'mrd USD',
        data: [
          economy.exports_billion_usd || 0,
          economy.imports_billion_usd || 0,
          economy.trade_balance_billion_usd || 0
        ],
        borderWidth: 0,
        borderRadius: 6,
        barThickness: 22
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#111827', padding: 9 }
      },
      scales: {
        y: {
          ticks: { font: { size: 10 } },
          grid: { color: 'rgba(0,0,0,0.06)' }
        },
        x: {
          ticks: { font: { size: 10 } },
          grid: { display: false }
        }
      }
    }
  });
}

function createEconomyChart(canvasId, economy, bank) {
  const canvas = document.getElementById(canvasId);

  if (!canvas) return;

  if (chartStore[canvasId]) {
    chartStore[canvasId].destroy();
  }

  chartStore[canvasId] = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: ['Infláció', 'Munkanélk.', 'Kamat'],
      datasets: [{
        label: '%',
        data: [
          economy.inflation_percent || 0,
          economy.unemployment_percent || 0,
          bank.interest_rate || 0
        ],
        borderWidth: 0,
        borderRadius: 6,
        barThickness: 22
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#111827', padding: 9 }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { font: { size: 10 } },
          grid: { color: 'rgba(0,0,0,0.06)' }
        },
        x: {
          ticks: { font: { size: 10 } },
          grid: { display: false }
        }
      }
    }
  });
}

function formatNumber(value) {
  if (value === undefined || value === null) return 'n/a';

  return Number(value).toLocaleString('hu-HU');
}

function formatPercent(value) {
  if (value === undefined || value === null || value === '') return 'n/a';

  return `${Number(value).toLocaleString('hu-HU')}%`;
}

function formatFxRate(value, quote) {
  if (value === undefined || value === null || value === '') return 'n/a';

  return `1 EUR = ${Number(value).toLocaleString('hu-HU')} ${quote || ''}`;
}

function escapeHtml(value) {
  if (value === undefined || value === null) return '';

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function slugify(text) {
  return text
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
}

loadProfiles();
</script>

</body>
</html>
