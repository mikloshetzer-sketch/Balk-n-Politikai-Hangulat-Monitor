<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Balkán Security Risk Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --page: #edf5f9;
      --card: #ffffff;
      --ink: #082f49;
      --text: #31556c;
      --muted: #678398;
      --line: #cddfe9;
      --blue: #2387bd;
      --shadow: 0 8px 24px rgba(22, 63, 86, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--page);
      color: var(--text);
      overflow: hidden;
    }

    header {
      height: 132px;
      background: linear-gradient(112deg, #123f5d 0%, #155a7c 58%, #2793c5 100%);
      color: white;
      padding: 26px 22px 22px;
      box-shadow: inset 0 -1px 0 rgba(255,255,255,.12);
      position: relative;
      z-index: 1000;
    }

    .header-inner {
      max-width: 1500px;
      margin: 0 auto;
    }

    .brand {
      margin-bottom: 7px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      color: #d9f1ff;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1;
      letter-spacing: -.02em;
      color: #ffffff;
    }

    .subtitle {
      color: #e5f3fa;
      font-size: 14px;
      margin-top: 8px;
    }

    #map {
      height: calc(100vh - 132px);
      width: 100%;
    }

    .legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      padding: 13px 14px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 999;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      min-width: 165px;
      backdrop-filter: blur(4px);
    }

    .legend strong {
      display: block;
      margin-bottom: 6px;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      font-size: 15px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
      color: var(--text);
    }

    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
      flex: 0 0 auto;
    }

    .popup-title {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      font-weight: 700;
      font-size: 17px;
      margin-bottom: 7px;
    }

    .popup-line {
      font-size: 13px;
      margin: 4px 0;
      color: var(--text);
      line-height: 1.4;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }

    .leaflet-popup-content {
      margin: 14px 16px;
    }

    .leaflet-control-zoom a {
      color: var(--ink) !important;
    }

    a {
      color: #176f9a;
    }

    @media (max-width: 700px) {
      header {
        height: 118px;
        padding: 22px 18px 18px;
      }

      h1 {
        font-size: 30px;
      }

      .subtitle {
        font-size: 13px;
      }

      #map {
        height: calc(100vh - 118px);
      }

      .legend {
        left: 12px;
        bottom: 12px;
        padding: 10px 11px;
        font-size: 12px;
        min-width: 145px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">TÖRÉSVONALAK.BLOG</div>
    <h1>Balkán Security Risk Map</h1>
    <div class="subtitle">
      Híralapú és eseményalapú biztonsági kockázati réteg
    </div>
  </div>
</header>

<div id="map"></div>

<div class="legend">
  <strong>Security risk</strong>
  <div class="legend-row"><span class="swatch" style="background:#16856f"></span> low</div>
  <div class="legend-row"><span class="swatch" style="background:#b79a25"></span> medium</div>
  <div class="legend-row"><span class="swatch" style="background:#d47b2d"></span> high</div>
  <div class="legend-row"><span class="swatch" style="background:#c94f5d"></span> critical</div>
  <div class="legend-row"><span class="swatch" style="background:#7890a0"></span> none</div>
</div>

<script>
const COUNTRY_POINTS = [
  { name: "Szerbia", lat: 44.0165, lng: 21.0059 },
  { name: "Bosznia-Hercegovina", lat: 43.9159, lng: 17.6791 },
  { name: "Koszovó", lat: 42.6026, lng: 20.9030 },
  { name: "Montenegró", lat: 42.7087, lng: 19.3744 },
  { name: "Észak-Macedónia", lat: 41.6086, lng: 21.7453 },
  { name: "Albánia", lat: 41.1533, lng: 20.1683 }
];

const map = L.map("map").setView([43.1, 20.2], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

function colorByLevel(level) {
  if (level === "critical") return "#c94f5d";
  if (level === "high") return "#d47b2d";
  if (level === "medium") return "#b79a25";
  if (level === "low") return "#16856f";
  return "#7890a0";
}

function radiusByScore(score) {
  const value = Number(score || 0);
  return 18000 + value * 900;
}

async function loadSecurityMap() {
  const response = await fetch("./data/security_risk.json");
  const data = await response.json();

  COUNTRY_POINTS.forEach(point => {
    const row = data.countries.find(item => item.name === point.name);

    if (!row) return;

    const color = colorByLevel(row.security_level);

    const circle = L.circle([point.lat, point.lng], {
      radius: radiusByScore(row.security_score),
      color: color,
      fillColor: color,
      fillOpacity: 0.42,
      weight: 2
    }).addTo(map);

    circle.bindPopup(`
      <div class="popup-title">${row.name}</div>
      <div class="popup-line">Security score: <strong>${row.security_score}</strong></div>
      <div class="popup-line">Szint: <strong>${row.security_level}</strong></div>
      <div class="popup-line">Forrás: <strong>${row.security_source}</strong></div>
      <div class="popup-line">Fő biztonsági narratíva: <strong>${row.main_event_type}</strong></div>
      <div class="popup-line">Eseményszám: <strong>${row.event_count}</strong></div>
    `);
  });
}

loadSecurityMap();
</script>

</body>
</html>
