<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Balkán Politikai Hangulat Monitor</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      background: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 26px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin-top: 8px;
      color: #d1d5db;
    }

    main {
      max-width: 1450px;
      margin: 22px auto;
      padding: 0 16px;
    }

    .status-box {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .status-item {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      background: #f9fafb;
    }

    .status-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .regional-button {
      display: inline-block;
      margin-top: 14px;
      padding: 11px 15px;
      border-radius: 12px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .regional-button:hover {
      background: #374151;
    }

    .small {
      color: #6b7280;
      font-size: 13px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(390px, 1fr));
      gap: 18px;
    }

    .country-card {
      background: white;
      border-radius: 14px;
      border-left: 7px solid #6b7280;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .positive { border-left-color: #16a34a; }
    .neutral { border-left-color: #f59e0b; }
    .negative { border-left-color: #dc2626; }

    .card-inner {
      padding: 16px;
    }

    .country-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .country-title {
      font-size: 22px;
      font-weight: 700;
    }

    .status-badge {
      border-radius: 10px;
      padding: 8px 10px;
      background: #f3f4f6;
      font-size: 13px;
      text-align: center;
      min-width: 70px;
    }

    .positive-badge {
      background: #ecfdf5;
      color: #047857;
    }

    .negative-badge {
      background: #fef2f2;
      color: #b91c1c;
    }

    .neutral-badge {
      background: #f9fafb;
      color: #374151;
    }

    .score-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .score-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
    }

    .score-label {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .score-value {
      font-size: 30px;
      font-weight: 700;
    }

    .positive-text { color: #16a34a; }
    .negative-text { color: #dc2626; }
    .neutral-text { color: #111827; }

    .social-score {
      color: #d97706;
    }

    .security-score {
      color: #b91c1c;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .metric {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
    }

    .metric strong {
      display: block;
      font-size: 16px;
      margin-top: 3px;
    }

    .topic-line {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .report-button {
      display: inline-block;
      margin-top: 8px;
      padding: 9px 12px;
      border-radius: 10px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .report-button:hover {
      background: #374151;
    }

    .social-box,
    .security-box,
    .chart-box,
    .topic-box,
    .news-section {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
      background: #ffffff;
    }

    .social-box {
      background: #f9fafb;
    }

    .security-box {
      background: #fff7ed;
      border-color: #fdba74;
    }

    .social-box h3,
    .security-box h3,
    .chart-box h3,
    .topic-box h3,
    .news-section h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
    }

    .chart-desc {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .chart-wrap {
      height: 150px;
    }

    .topic-chart-wrap {
      height: 155px;
    }

    .news-list {
      margin: 0;
      padding-left: 18px;
    }

    .news-list li {
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.35;
    }

    .news-list a {
      color: #2563eb;
      text-decoration: none;
    }

    .news-list a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      padding: 28px 10px;
    }

    @media (max-width: 600px) {
      .score-row {
        grid-template-columns: 1fr;
      }

      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Balkán Politikai Hangulat Monitor</h1>
  <p>Hírindex, social media index, security risk és domináns narratívák</p>
</header>

<main>

  <section class="status-box">
    <div class="status-grid">
      <div class="status-item">
        <strong>Frissítés</strong>
        <span class="small" id="updatedAt">Betöltés...</span>
      </div>

      <div class="status-item">
        <strong>Hírforrás</strong>
        <span class="small" id="sourceInfo">Betöltés...</span>
      </div>

      <div class="status-item">
        <strong>Social forrás</strong>
        <span class="small" id="socialInfo">Betöltés...</span>
      </div>
    </div>

    <p class="small" id="methodNote" style="margin-top:12px;"></p>

    <div id="regionalButtonWrap"></div>

    <a class="regional-button"
       href="./security-map.html"
       target="_blank"
       rel="noopener noreferrer">
      Security Risk Map megnyitása
    </a>
  </section>

  <section class="dashboard-grid" id="countryGrid"></section>

</main>

<footer>
  Balkán Politikai Hangulat Monitor – GitHub Pages
</footer>

<script>
let chartStore = {};

async function loadData() {
  try {
    const latestResponse = await fetch('./data/latest.json');
    const historyResponse = await fetch('./data/history.json');
    const socialResponse = await fetch('./data/social_latest.json');
    const reportsResponse = await fetch('./data/reports_index.json');
    const securityResponse = await fetch('./data/security_risk.json');

    const latestData = await latestResponse.json();
    const historyData = await historyResponse.json();
    const socialData = await socialResponse.json();
    const reportsData = await reportsResponse.json();
    const securityData = await securityResponse.json();

    document.getElementById('updatedAt').textContent =
      latestData.updated_at || 'nincs adat';

    document.getElementById('sourceInfo').textContent =
      latestData.source || 'nincs megadva';

    document.getElementById('socialInfo').textContent =
      `${socialData.source || 'nincs megadva'} – ${socialData.updated_at || 'nincs időpont'}`;

    document.getElementById('methodNote').textContent =
      latestData.method_note || '';

    buildRegionalButton(reportsData);

    const grid = document.getElementById('countryGrid');
    grid.innerHTML = '';

    latestData.countries.forEach(country => {
      const socialSignal = getSocialSignal(country.name, socialData);
      const securitySignal = getSecuritySignal(country.name, securityData);

      const reportUrl = getReportUrl(country.name, reportsData);

      const trendChartId = `trend-${slugify(country.name)}`;
      const topicChartId = `topics-${slugify(country.name)}`;

      const card = document.createElement('div');
      card.className = `country-card ${country.status}`;

      card.innerHTML = `
        <div class="card-inner">

          <div class="country-header">
            <div>
              <div class="country-title">${country.name}</div>
              ${buildReportButton(reportUrl)}
            </div>

            <div class="status-badge ${getBadgeClass(country.status)}">
              <strong>${country.score}</strong><br>
              ${getStatusText(country.status)}
            </div>
          </div>

          <div class="score-row">
            <div class="score-box">
              <div class="score-label">Hírindex</div>
              <div class="score-value ${getTextClass(country.status)}">
                ${country.score}
              </div>
              <div class="small">${getStatusText(country.status)}</div>
            </div>

            <div class="score-box">
              <div class="score-label">Social media index</div>
              <div class="score-value social-score">
                ${socialSignal.score || 0}
              </div>
              <div class="small">${getSocialLevelText(socialSignal.level)}</div>
            </div>
          </div>

          <div class="metric-grid">
            <div class="metric">Cikkek<strong>${country.article_count || 0}</strong></div>
            <div class="metric">Hír negatív<strong>${country.negative_hits || 0}</strong></div>
            <div class="metric">Hír pozitív<strong>${country.positive_hits || 0}</strong></div>
            <div class="metric">Social említés<strong>${socialSignal.mentions || 0}</strong></div>
          </div>

          <div class="topic-line">
            Fő hír téma: <strong>${country.main_topic || 'nincs adat'}</strong>
          </div>

          <div class="security-box">
            <h3>Biztonsági réteg</h3>

            <div class="metric-grid">
              <div class="metric">
                Security risk
                <strong>${securitySignal.security_score || 0}</strong>
              </div>

              <div class="metric">
                Szint
                <strong>${securitySignal.security_level || 'none'}</strong>
              </div>

              <div class="metric">
                Események
                <strong>${securitySignal.event_count || 0}</strong>
              </div>

              <div class="metric">
                Forrás
                <strong>${securitySignal.security_source || 'none'}</strong>
              </div>
            </div>

            <div class="topic-line">
              Fő biztonsági narratíva:
              <strong>${securitySignal.main_event_type || 'nincs adat'}</strong>
            </div>
          </div>

          <div class="topic-box">
            <h3>Domináns narratívák</h3>

            <div class="chart-desc">
              A témacsoportok relatív súlya az aktuális híranyag alapján.
            </div>

            <div class="topic-chart-wrap">
              <canvas id="${topicChartId}"></canvas>
            </div>
          </div>

          <div class="social-box">
            <h3>Social signal</h3>

            <div class="metric-grid">
              <div class="metric">
                Említések
                <strong>${socialSignal.mentions || 0}</strong>
              </div>

              <div class="metric">
                Negatív
                <strong>${socialSignal.negative_hits || 0}</strong>
              </div>

              <div class="metric">
                Pozitív
                <strong>${socialSignal.positive_hits || 0}</strong>
              </div>

              <div class="metric">
                Index
                <strong>${socialSignal.score || 0}</strong>
              </div>
            </div>

            <div class="topic-line">
              Reddit: ${getSourceCount(socialSignal, 'reddit')} |
              Mastodon: ${getSourceCount(socialSignal, 'mastodon')} |
              Fő social téma:
              <strong>${socialSignal.main_topic || 'nincs adat'}</strong>
            </div>
          </div>

          <div class="chart-box">
            <h3>Mini kombinált trenddiagram</h3>

            <div class="chart-desc">
              Kék vonal: hírindex. Világoskék oszlop: social media index.
            </div>

            <div class="chart-wrap">
              <canvas id="${trendChartId}"></canvas>
            </div>
          </div>

          ${buildArticlesHtml(country.top_articles || [])}

        </div>
      `;

      grid.appendChild(card);

      createTopicChart(topicChartId, country.topic_scores || {});
      createMiniComboChart(
        trendChartId,
        country.name,
        historyData,
        socialSignal,
        country.score
      );
    });

  } catch (error) {
    console.error(error);

    document.getElementById('countryGrid').innerHTML = `
      <div class="country-card negative">
        <div class="card-inner">
          <div class="country-title">Adatbetöltési hiba</div>
          <p>Nem sikerült betölteni az adatfájlokat.</p>
        </div>
      </div>
    `;
  }
}

function getSecuritySignal(countryName, securityData) {
  const fallback = {
    security_score: 0,
    security_level: 'none',
    security_source: 'none',
    event_count: 0,
    main_event_type: 'nincs adat'
  };

  if (!securityData || !securityData.countries) {
    return fallback;
  }

  const row = securityData.countries.find(
    item => item.name === countryName
  );

  if (!row) {
    return fallback;
  }

  return row;
}

function buildRegionalButton(reportsData) {
  const wrap = document.getElementById('regionalButtonWrap');

  if (!reportsData || !reportsData.regional_overview) {
    wrap.innerHTML =
      `<span class="small">Régiós helyzetkép még nem érhető el.</span>`;

    return;
  }

  wrap.innerHTML = `
    <a class="regional-button"
       href="${reportsData.regional_overview}"
       target="_blank"
       rel="noopener noreferrer">
      Mai Balkán helyzetkép megnyitása
    </a>
  `;
}

function buildReportButton(reportUrl) {
  if (!reportUrl) {
    return `
      <span class="small">
        Riport még nem érhető el
      </span>
    `;
  }

  return `
    <a class="report-button"
       href="${reportUrl}"
       target="_blank"
       rel="noopener noreferrer">
      Szöveges helyzetkép megnyitása
    </a>
  `;
}

function getReportUrl(countryName, reportsData) {
  if (!reportsData || !reportsData.reports) {
    return null;
  }

  const row = reportsData.reports.find(
    item => item.name === countryName
  );

  if (!row || !row.url) {
    return null;
  }

  return row.url;
}

function createTopicChart(canvasId, topicScores) {
  const canvas = document.getElementById(canvasId);

  if (!canvas) return;

  if (chartStore[canvasId]) {
    chartStore[canvasId].destroy();
  }

  const entries = Object.entries(topicScores || {}).slice(0, 4);

  const labels = entries.length
    ? entries.map(item => shortenTopic(item[0]))
    : ['Nincs adat'];

  const values = entries.length
    ? entries.map(item => item[1])
    : [0];

  chartStore[canvasId] = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Téma súly',
          data: values,
          borderWidth: 0,
          borderRadius: 6,
          barThickness: 13,
          maxBarThickness: 15,
          backgroundColor: 'rgba(37, 99, 235, 0.72)'
        }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          backgroundColor: '#111827',
          padding: 9
        }
      },
      scales: {
        x: {
          beginAtZero: true,
          ticks: {
            font: { size: 10 }
          },
          grid: {
            color: 'rgba(0,0,0,0.06)'
          }
        },
        y: {
          ticks: {
            font: { size: 10 }
          },
          grid: {
            display: false
          }
        }
      }
    }
  });
}

function createMiniComboChart(
  canvasId,
  countryName,
  historyData,
  socialSignal,
  currentNewsScore
) {
  const canvas = document.getElementById(canvasId);

  if (!canvas) return;

  if (chartStore[canvasId]) {
    chartStore[canvasId].destroy();
  }

  const historyRows = getCountryHistory(
    countryName,
    historyData
  );

  let labels = historyRows.map(
    row => shortDate(row.date)
  );

  let newsIndex = historyRows.map(
    row => row.score
  );

  let socialIndex = historyRows.map(
    row => row.social_score || 0
  );

  if (labels.length === 0) {
    labels = ['Ma'];

    newsIndex = [currentNewsScore || 0];

    socialIndex = [socialSignal.score || 0];
  } else {
    newsIndex[newsIndex.length - 1] =
      currentNewsScore ||
      newsIndex[newsIndex.length - 1] ||
      0;

    socialIndex[socialIndex.length - 1] =
      socialSignal.score || 0;
  }

  chartStore[canvasId] = new Chart(canvas, {
    data: {
      labels: labels,
      datasets: [
        {
          type: 'bar',
          label: 'Social media index',
          data: socialIndex,
          yAxisID: 'ySocial',
          barThickness: 12,
          maxBarThickness: 14,
          borderWidth: 0,
          borderRadius: 5,
          backgroundColor: 'rgba(147, 197, 253, 0.75)'
        },
        {
          type: 'line',
          label: 'Hírindex',
          data: newsIndex,
          yAxisID: 'yNews',
          tension: 0.35,
          borderWidth: 2,
          pointRadius: 2,
          pointHoverRadius: 4,
          borderColor: '#2563eb',
          backgroundColor: '#2563eb'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false
      },
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            boxWidth: 10,
            font: { size: 10 }
          }
        },
        tooltip: {
          backgroundColor: '#111827',
          padding: 9
        }
      },
      scales: {
        yNews: {
          type: 'linear',
          position: 'left',
          min: -30,
          max: 30,
          ticks: {
            font: { size: 10 }
          },
          title: {
            display: true,
            text: 'Hírindex',
            font: { size: 10 }
          },
          grid: {
            color: 'rgba(0,0,0,0.06)'
          }
        },
        ySocial: {
          type: 'linear',
          position: 'right',
          beginAtZero: true,
          suggestedMax: 30,
          ticks: {
            font: { size: 10 }
          },
          title: {
            display: true,
            text: 'Social',
            font: { size: 10 }
          },
          grid: {
            drawOnChartArea: false
          }
        },
        x: {
          ticks: {
            font: { size: 10 },
            maxRotation: 0
          },
          grid: {
            display: false
          }
        }
      }
    }
  });
}

function getCountryHistory(countryName, historyData) {
  const rows = [];
  const records = historyData.records || [];

  records.forEach(record => {
    const country = record.countries.find(
      item => item.name === countryName
    );

    if (country) {
      rows.push({
        date: record.date,
        score: country.score || 0,
        social_score: country.social_score || 0
      });
    }
  });

  return rows.slice(-7);
}

function getSocialSignal(countryName, socialData) {
  const fallback = {
    score: 0,
    level: 'low',
    mentions: 0,
    negative_hits: 0,
    positive_hits: 0,
    source_counts: {},
    main_topic: 'nincs adat'
  };

  if (!socialData || !socialData.countries) {
    return fallback;
  }

  const row = socialData.countries.find(
    item => item.name === countryName
  );

  if (!row || !row.social_signal) {
    return fallback;
  }

  return row.social_signal;
}

function getSourceCount(
  socialSignal,
  sourceName
) {
  if (!socialSignal || !socialSignal.source_counts) {
    return 0;
  }

  return socialSignal.source_counts[sourceName] || 0;
}

function buildArticlesHtml(articles) {
  if (!articles.length) {
    return `
      <div class="news-section">
        <h3>Kiemelt cikkek</h3>
        <p class="small">
          Nincs megjeleníthető cikk.
        </p>
      </div>
    `;
  }

  const items = articles.slice(0, 5).map(article => {
    const title = article.title || 'Cím nélkül';
    const url = article.url || '#';
    const source = article.source || 'ismeretlen forrás';

    return `
      <li>
        <a href="${url}"
           target="_blank"
           rel="noopener noreferrer">
          ${title}
        </a>
        <br>
        <span class="small">${source}</span>
      </li>
    `;
  }).join('');

  return `
    <div class="news-section">
      <h3>Kiemelt cikkek</h3>
      <ul class="news-list">${items}</ul>
    </div>
  `;
}

function getStatusText(status) {
  if (status === 'positive') return 'pozitív';
  if (status === 'negative') return 'negatív';
  return 'semleges';
}

function getSocialLevelText(level) {
  if (level === 'high') return 'magas aktivitás';
  if (level === 'medium') return 'közepes aktivitás';
  return 'alacsony aktivitás';
}

function getBadgeClass(status) {
  if (status === 'positive') return 'positive-badge';
  if (status === 'negative') return 'negative-badge';
  return 'neutral-badge';
}

function getTextClass(status) {
  if (status === 'positive') return 'positive-text';
  if (status === 'negative') return 'negative-text';
  return 'neutral-text';
}

function shortDate(dateString) {
  if (!dateString) return '';

  const parts = dateString.split('-');

  if (parts.length !== 3) {
    return dateString;
  }

  return `${parts[1]}.${parts[2]}`;
}

function shortenTopic(topic) {
  const replacements = {
    'Belpolitikai tüntetések és társadalmi nyomás': 'Tüntetések',
    'EU-integráció és csatlakozási folyamat': 'EU-integráció',
    'Koszovó–Szerbia feszültség': 'Koszovó–Szerbia',
    'Boszniai intézményi válság és OHR-vita': 'Bosznia/OHR',
    'Korrupció, jogállamiság és igazságszolgáltatás': 'Jogállamiság',
    'Biztonságpolitikai kockázatok és erőszak': 'Biztonsági kockázat',
    'Kormányzati stabilitás és választási dinamika': 'Kormányzás/választás',
    'Gazdaság, energia és beruházások': 'Gazdaság/energia',
    'Nemzetközi kapcsolatok és nagyhatalmi befolyás': 'Külső befolyás',
    'Montenegró EU-csatlakozási előrehaladása': 'Montenegró EU',
    'Albán digitalizáció és kiberbiztonság': 'Albán digitalizáció',
    'Bolgár–macedón identitásvita': 'Macedón identitásvita'
  };

  return replacements[topic] || topic;
}

function slugify(text) {
  return text
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
}

loadData();
